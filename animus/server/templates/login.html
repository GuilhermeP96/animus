<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Animus — Abstergo Industries</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⟁</text></svg>">
    <style>
        :root {
            --bg: #060a10;
            --surface: #0e1420;
            --border: #1a2535;
            --glow: #00d4ff;
            --gold: #c8a84e;
            --red: #ff3b3b;
            --text: #8a9ab0;
            --white: #e8f0f8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* Scanlines */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 212, 255, 0.02) 2px,
                rgba(0, 212, 255, 0.02) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-icon {
            font-size: 72px;
            display: block;
            margin-bottom: 16px;
            color: var(--glow);
            text-shadow: 0 0 40px var(--glow), 0 0 80px rgba(0, 212, 255, 0.3);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { text-shadow: 0 0 40px var(--glow), 0 0 80px rgba(0, 212, 255, 0.3); }
            50% { text-shadow: 0 0 60px var(--glow), 0 0 120px rgba(0, 212, 255, 0.4); }
        }

        .login-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text);
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 32px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--glow), transparent);
            animation: scanLine 3s linear infinite;
        }

        @keyframes scanLine {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h2 {
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--white);
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--glow);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1), 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .form-input::placeholder {
            color: #3a4a5a;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 212, 255, 0.05));
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            color: var(--glow);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 212, 255, 0.1));
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            background: rgba(255, 59, 59, 0.1);
            border: 1px solid rgba(255, 59, 59, 0.3);
            color: var(--red);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 10px;
            color: #3a4a5a;
            letter-spacing: 1px;
        }

        .login-creed {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--gold);
            font-style: italic;
            opacity: 0.6;
        }

        /* Decorative corners */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--glow);
            opacity: 0.3;
        }
        .corner-tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid; border-right: 2px solid; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-brand">
            <span class="login-icon">⟁</span>
            <div class="login-title">Animus</div>
            <div class="login-subtitle">Abstergo Industries</div>
        </div>

        <div class="login-card">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <div class="login-header">
                <h2>Synchronization Required</h2>
            </div>

            {% if error %}
            <div class="error-msg">⚠ {{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label" for="username">Subject ID</label>
                    <input class="form-input" type="text" id="username" name="username"
                           placeholder="Enter your Subject ID" required autocomplete="username" autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Access Code</label>
                    <input class="form-input" type="password" id="password" name="password"
                           placeholder="Enter your access code" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Enter the Animus</button>
            </form>

            <div class="login-footer">
                AUTHORIZED PERSONNEL ONLY • ABSTERGO SEC-LEVEL 4
            </div>
        </div>

        <div class="login-creed">
            "We work in the dark to serve the light"
        </div>
    </div>
</body>
</html>
