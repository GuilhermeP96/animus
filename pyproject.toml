[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animus"
version = "0.9.3"
description = "Animus — AI Memory Synchronization Network"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Guilherme Pinheiro"}]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "watchdog>=4.0",
    "cryptography>=50.0.0",
    "rich>=13.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-multipart>=0.0.31",
    "pyjwt==2.15.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://datano.com.br/animus"
Repository = "https://github.com/GuilhermeP96/animus"
Issues = "https://github.com/GuilhermeP96/animus/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
vector = ["sentence-transformers>=3.0", "numpy"]

[project.scripts]
animus = "animus.cli:app"
animus-mcp = "animus.mcp:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "docs/licenses/LEGACY-MIT.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["animus*"]

[tool.setuptools.package-data]
"animus.network" = ["windows-update-task.ps1"]
"animus.server" = [
    "templates/*.html",
    "static/**/*",
    "installer_kit/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100
