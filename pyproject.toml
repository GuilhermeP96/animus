[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animus"
version = "0.5.1"
description = "Animus — Copilot + Claude Code Memory Synchronization Network"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "watchdog>=4.0",
    "cryptography>=43.0",
    "rich>=13.0",
    "typer>=0.12",
    "sqlitedict>=2.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
vector = ["sentence-transformers>=3.0", "numpy"]

[project.scripts]
animus = "animus.cli:app"
animus-mcp = "animus.mcp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["animus*"]

[tool.setuptools.package-data]
"animus.server" = [
    "templates/*.html",
    "static/**/*",
    "installer_kit/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100
