[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animus"
version = "0.1.0"
description = "Animus — Copilot Memory Synchronization Network"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "watchdog>=4.0",
    "cryptography>=43.0",
    "rich>=13.0",
    "typer>=0.12",
    "sqlitedict>=2.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
vector = ["sentence-transformers>=3.0", "numpy"]

[project.scripts]
animus = "animus.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["animus*"]

[tool.ruff]
target-version = "py310"
line-length = 100
