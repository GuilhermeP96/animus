# Animus Hub — Nginx reverse proxy snippet
# Include in your VPS Hub nginx config:
#   include /opt/vps-hub/animus/vps-hub/nginx.conf;

upstream animus_hub {
    server 127.0.0.1:8314;
}

server {
    listen 80;
    server_name animus.example.com;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name animus.example.com;

    # SSL certs (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/animus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animus.example.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API & Web
    location / {
        proxy_pass http://animus_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket sync endpoint
    location /ws/ {
        proxy_pass http://animus_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
